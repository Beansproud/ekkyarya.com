# Builds the Android app (Capacitor) and publishes it as a direct download for the site's "Get the app" button:
# https://github.com/rfim/ekkyarya.com/releases/download/app-latest/ekky-arya.apk
# Signed with the owner's fixed key when the ANDROID_KEYSTORE_* secrets are set (owner, 2026-10-28), so updates
# install over the old app; phones that have a debug build installed uninstall it once. See docs/android-apk.md.
name: Android APK

on:
  push:
    branches: [main]
    paths: ["index.html", "css/**", "js/**", "assets/**", "android/**", "capacitor.config.json", "package*.json", "scripts/build.mjs", ".github/workflows/android-apk.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Build the web app and sync it into Android
        run: |
          npm ci
          npm run cap:sync
      - name: Build the APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../ekky-arya.apk
      # The owner's fixed key (repository secrets) signs every build, so a new APK installs over the old one.
      # Without the secrets the APK stays debug-signed, as before.
      - name: Sign with the fixed release key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "No release key secrets: the APK stays debug-signed."; exit 0; fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          SIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          "$SIGNER" sign --ks "$RUNNER_TEMP/release.jks" --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEYSTORE_PASSWORD ekky-arya.apk
          "$SIGNER" verify --print-certs ekky-arya.apk | head -3
          rm -f "$RUNNER_TEMP/release.jks"
      - name: Publish to the app-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view app-latest >/dev/null 2>&1 || gh release create app-latest --prerelease --title "Ekky Arya Android app (latest build)" --notes "Built automatically from main. Debug-signed: install by allowing apps from this source."
          gh release upload app-latest ekky-arya.apk --clobber
